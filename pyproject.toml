[project]
name = "mailmate"
version = "0.1.0"
description = "MailMate - human-approved, throttled recruiter outreach through n8n and Gmail"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50",
    "pydantic>=2.7",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "dnspython>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mailmate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
