# MailMate holds personal data (recruiter lists, replies) and can send email.
# Serve it to this machine only - Streamlit's default listens on the whole network.
[server]
address = "localhost"
headless = true
maxUploadSize = 5   # MB; job lists are small

[browser]
gatherUsageStats = false

[client]
# No "Deploy" button: MailMate stays on this machine (rule 7). Community Cloud apps are public.
toolbarMode = "minimal"
